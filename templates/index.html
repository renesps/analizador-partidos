<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <style>

        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .card {

        }
        .card h2 { font-size: 16px; color: #333; margin-bottom: 14px;

        input, select {
            width: 100%; padding: 11px 13px;
            border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px;

        }

        button {

        }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sm {

        #stepMsg  { color: #555; font-size: 14px; font-weight: 500; }
        #subMsg   { color: #999; font-size: 12px; margin-top: 5px; }
        #stepMsgM { color: #555; font-size: 14px; font-weight: 500; }
        #subMsgM  { color: #999; font-size: 12px; margin-top: 5px; }

        .resultado { display: none; }

        .match-header { text-align: center; }
        .vs-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 14px 0; flex-wrap: wrap; }
        .team-name { font-size: 20px; font-weight: 700; color: #222; }
        .vs-badge { background: #667eea; color: white; padding: 5px 14px; border-radius: 20px; font-weight: bold; }
        .match-meta { color: #666; font-size: 13px; line-height: 2; }
        .source-ok  { display:inline-block; background:#e8f5e9; color:#2e7d32; font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px; margin-top:6px; }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 560px) { .two-col { grid-template-columns: 1fr; } }

        }

        .save-btn.saved { background: #c8e6c9; cursor: default; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">

<script>
/* ════════════════════════════════════════════════════════════════════════════
   GLOBALS
════════════════════════════════════════════════════════════════════════════ */
const KIMI_KEY = '{{ kimi_key }}';

// Mapa de nombre de liga → tournament_id en Sofascore (unique tournament IDs)
const LIGA_IDS = {
    'Premier League':           17,
    'La Liga':                  8,
    'Serie A':                  23,
    'Bundesliga':               35,
    'Ligue 1':                  34,
    'Champions League':         7,
    'Europa League':            679,
    'Conference League':        17015,
    'Primeira Liga':            238,
    'Copa Libertadores':        384,
    'Copa Sudamericana':        480,
    'Brasileirao':              325,
    'Super Lig':                52,
    'Liga Profesional Argentina': 155,
    'MLS':                      242,
    'Eredivisie':               37,
};

/* ════════════════════════════════════════════════════════════════════════════
   TABS
════════════════════════════════════════════════════════════════════════════ */
function switchTab(id) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    const idx = ['tab-single','tab-multi','tab-historial'].indexOf(id);
    document.querySelectorAll('.tab-btn')[idx].classList.add('active');
}

/* ════════════════════════════════════════════════════════════════════════════
   SOFASCORE — llamada directa desde el browser del usuario (IP residencial)
   Sofascore tiene CORS abierto (ACAO: *) y solo bloquea IPs de datacenter.
   El browser del usuario siempre obtiene 200, sin proxies ni créditos.
════════════════════════════════════════════════════════════════════════════ */
const SF_BASE = 'https://api.sofascore.com/api/v1';
const SF_HDRS = {
    'Accept':          'application/json, text/plain, */*',
    'Accept-Language': 'es-ES,es;q=0.9,en;q=0.8',
    'Referer':         'https://www.sofascore.com/',
    'Origin':          'https://www.sofascore.com',
};

// Caché browser-side: evita requests duplicados dentro del mismo análisis
const _sfCache = {};
const SF_CACHE_TTL = 300000; // 5 minutos en ms

async function sfGet(path) {
    const url = SF_BASE + path;

    // 1. Caché en memoria del browser
    const cached = _sfCache[url];
    if (cached && (Date.now() - cached.ts) < SF_CACHE_TTL) return cached.data;

    // 2. Request directo desde el browser (IP residencial del usuario)
    try {
        const r = await fetch(url, { headers: SF_HDRS });
        if (r.ok) {
            const j = await r.json();
            if (j && !j.error) {
                _sfCache[url] = { ts: Date.now(), data: j };
                return j;
            }
        }
    } catch(_) {}
    return null;
}

function step(msg, sub='') {
    document.getElementById('stepMsg').textContent = msg;
    document.getElementById('subMsg').textContent  = sub;
}
function stepM(msg, sub='') {
    document.getElementById('stepMsgM').textContent = msg;
    document.getElementById('subMsgM').textContent  = sub;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function val(x)    { return (x !== null && x !== undefined && x !== '') ? x : '—'; }

/* ════════════════════════════════════════════════════════════════════════════
   TAB 1: PARTIDO INDIVIDUAL
════════════════════════════════════════════════════════════════════════════ */
document.getElementById('frm').addEventListener('submit', async e => {
    e.preventDefault();
    const eqA  = document.getElementById('eqA').value.trim();
    const eqB  = document.getElementById('eqB').value.trim();
    const btn  = document.getElementById('btn');

    document.getElementById('loading').style.display   = 'block';
    document.getElementById('resultado').style.display = 'none';
    btn.disabled = true;

    try {
        step('Buscando equipos en Sofascore...');
        const [rA, rB] = await Promise.all([
            sfGet('/search/all?q=' + encodeURIComponent(eqA)),
            sfGet('/search/all?q=' + encodeURIComponent(eqB)),
        ]);

        const teamA = firstTeam(rA, eqA);
        const teamB = firstTeam(rB, eqB);

        if (!teamA) { renderError('No se encontró el equipo: ' + eqA); return; }
        if (!teamB) { renderError('No se encontró el equipo: ' + eqB); return; }

        step('Buscando el partido...', teamA.nombre + ' vs ' + teamB.nombre);
        const evento = await buscarPartido(teamA.id, teamB.id);
        if (!evento) { renderError('No se encontró el próximo partido entre ' + eqA + ' y ' + eqB); return; }

        const resultado = await fetchResultadoCompleto(evento, teamA.id, teamB.id);

        step('Listo!');
        renderResultado(resultado, 'resultado', true);
        pedirAnalisisIA(resultado, 'ia-body', 'ia-loading', true);

    } catch(err) {
        renderError('Error: ' + err.message);
    } finally {
        document.getElementById('loading').style.display = 'none';
        btn.disabled = false;
    }
});

/* ════════════════════════════════════════════════════════════════════════════
   TAB 2: ANALIZAR JORNADA
════════════════════════════════════════════════════════════════════════════ */

let jornadaEventos = [];   // partidos cargados de la jornada
let jornadaSeleccionados = new Set();

document.getElementById('frmMulti').addEventListener('submit', async e => {
    e.preventDefault();
    const liga = document.getElementById('ligaMulti').value;
    if (!liga) { alert('Seleccioná una competición'); return; }

    const ligaId = LIGA_IDS[liga];
    if (!ligaId) { alert('Liga no soportada todavía'); return; }

    document.getElementById('loadingMulti').style.display = 'block';
    document.getElementById('listaJornada').style.display = 'none';
    document.getElementById('resultadoMulti').innerHTML = '';
    document.getElementById('btnBuscarJornada').disabled = true;

    try {
        stepM('Buscando partidos de hoy en ' + liga + '...');

        // 1. Obtener la season activa (la primera de la lista)
        const seasonsData = await sfGet('/unique-tournament/' + ligaId + '/seasons');
        const seasons = seasonsData?.seasons || [];
        const seasonId = seasons.length ? seasons[0].id : null;

        let allEvents = [];

        if (seasonId) {
            // 2a. Pedir next/0, next/1, last/0 y last/1 en paralelo:
            // - next/* = partidos que aún no empezaron
            // - last/* = partidos que ya empezaron o terminaron hoy
            // Necesario para ver la jornada completa (no solo los que faltan)
            const base = '/unique-tournament/' + ligaId + '/season/' + seasonId + '/events/';
            const [next0, next1, last0, last1] = await Promise.all([
                sfGet(base + 'next/0'),
                sfGet(base + 'next/1'),
                sfGet(base + 'last/0'),
                sfGet(base + 'last/1'),
            ]);
            allEvents = [
                ...(last1?.events || []),  // partidos ya jugados (página 2)
                ...(last0?.events || []),  // partidos ya jugados (página 1)
                ...(next0?.events || []),  // partidos próximos (página 1)
                ...(next1?.events || []),  // partidos próximos (página 2)
            ];

            // Si sigue vacío, probar la season anterior (solapamiento de temporadas)
            if (!allEvents.length && seasons.length > 1) {
                const base2 = '/unique-tournament/' + ligaId + '/season/' + seasons[1].id + '/events/';
                const [p0, p1, pl0, pl1] = await Promise.all([
                    sfGet(base2 + 'next/0'), sfGet(base2 + 'next/1'),
                    sfGet(base2 + 'last/0'), sfGet(base2 + 'last/1'),
                ]);
                allEvents = [
                    ...(pl1?.events || []), ...(pl0?.events || []),
                    ...(p0?.events || []),  ...(p1?.events || []),
                ];
            }
        } else {
            // Fallback: sin season
            const base = '/unique-tournament/' + ligaId + '/events/';
            const [p0, p1, pl0, pl1] = await Promise.all([
                sfGet(base + 'next/0'), sfGet(base + 'next/1'),
                sfGet(base + 'last/0'), sfGet(base + 'last/1'),
            ]);
            allEvents = [
                ...(pl1?.events || []), ...(pl0?.events || []),
                ...(p0?.events || []),  ...(p1?.events || []),
            ];
        }

        // Deduplicar por id (por si hay solapamiento entre páginas)
        const _seen = new Set();
        allEvents = allEvents.filter(ev => {
            if (_seen.has(ev.id)) return false;
            _seen.add(ev.id); return true;
        });

        // Ordenar por timestamp ascendente (last/0 y next/0 vienen mezclados)
        allEvents.sort((a, b) => (a.startTimestamp || 0) - (b.startTimestamp || 0));

        // Filtrar por hoy — usar fecha LOCAL (no UTC) para evitar edge cases de timezone
        const _now = new Date();
        const todayStr = _now.getFullYear() + '-' +
            String(_now.getMonth() + 1).padStart(2, '0') + '-' +
            String(_now.getDate()).padStart(2, '0');

        let partidos = allEvents.filter(ev => {
            const ts = ev.startTimestamp || 0;
            const d = new Date(ts * 1000);
            const dStr = d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
            return dStr === todayStr;
        });

        // Si no hay hoy, mostrar los 10 más cercanos a ahora (próximos primero, recientes después)
        if (!partidos.length) {
            const ahoraSec = Date.now() / 1000;
            const futuros = allEvents
                .filter(ev => (ev.startTimestamp || 0) >= ahoraSec)
                .sort((a, b) => a.startTimestamp - b.startTimestamp);
            const pasados = allEvents
                .filter(ev => (ev.startTimestamp || 0) < ahoraSec)
                .sort((a, b) => b.startTimestamp - a.startTimestamp);
            partidos = [...futuros, ...pasados].slice(0, 10);
        }

        jornadaEventos = partidos;
        jornadaSeleccionados.clear();
        // Detectar si los partidos son de hoy o del fallback
        const _todayCheck = new Date();
        const _todayStrCheck = _todayCheck.getFullYear() + '-' +
            String(_todayCheck.getMonth()+1).padStart(2,'0') + '-' +
            String(_todayCheck.getDate()).padStart(2,'0');
        const sonDeHoy = partidos.length > 0 && partidos.every(ev => {
            const d = new Date((ev.startTimestamp||0)*1000);
            const dStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
            return dStr === _todayStrCheck;
        });
        renderListaJornada(liga, partidos, sonDeHoy);

    } catch(err) {
        alert('Error al buscar partidos: ' + err.message);
    } finally {
        document.getElementById('loadingMulti').style.display = 'none';
        document.getElementById('btnBuscarJornada').disabled = false;
    }
});

function renderListaJornada(liga, partidos, sonDeHoy) {
    document.getElementById('ligaJornadaTitulo').textContent = liga + ' — Partidos disponibles (' + partidos.length + ')';

    const ul = document.getElementById('matchListUI');
    ul.innerHTML = '';

    if (!partidos.length) {
        ul.innerHTML = '<li style="padding:16px;color:#aaa;font-size:14px">No hay partidos disponibles para hoy.</li>';
        document.getElementById('listaJornada').style.display = 'block';
        return;
    }

    // Banner cuando no hay partidos hoy y se muestra el fallback
    if (!sonDeHoy) {
        const fechaProx = new Date(partidos[0].startTimestamp * 1000).toLocaleDateString('es-AR', {
            weekday: 'long', day: 'numeric', month: 'long'
        });
        const banner = document.createElement('li');
        banner.style.cssText = 'padding:10px 16px;background:#2a2a1a;border-left:3px solid #f0c040;color:#f0c040;font-size:13px;list-style:none;border-radius:4px;margin-bottom:4px';
        banner.textContent = '⚠️ No hay partidos hoy. Mostrando próximos partidos: ' + fechaProx;
        ul.appendChild(banner);
    }

    partidos.forEach((ev, idx) => {
        const home = ev.homeTeam?.name || '?';
        const away = ev.awayTeam?.name || '?';
        const ts   = ev.startTimestamp;
        const hora = ts ? new Date(ts * 1000).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '--:--';
        const ronda = ev.roundInfo?.name || (ev.roundInfo?.round ? 'Fecha ' + ev.roundInfo.round : '');

        // Mostrar fecha del partido si no son de hoy (pueden ser de distintos días en el fallback)
        let fechaLabel = '';
        if (!sonDeHoy && ts) {
            fechaLabel = new Date(ts * 1000).toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ';
        }

        const li = document.createElement('li');
        li.className = 'match-item';
        li.dataset.idx = idx;
        li.innerHTML = `
            <input type="checkbox" id="chk${idx}" onchange="togglePartido(${idx})">
            <div class="match-item-info">
                <div class="match-item-name">${home} <span style="color:#aaa">vs</span> ${away}</div>
                <div class="match-item-meta">${ronda}</div>
            </div>
            <div class="match-item-hora">${fechaLabel}${hora}</div>
        `;
        li.onclick = (e) => {
            if (e.target.type !== 'checkbox') {
                const chk = document.getElementById('chk' + idx);
                chk.checked = !chk.checked;
                togglePartido(idx);
            }
        };
        ul.appendChild(li);
    });

    actualizarBotonAnalizar();
    document.getElementById('listaJornada').style.display = 'block';
}

function togglePartido(idx) {
    const li = document.querySelector(`.match-item[data-idx="${idx}"]`);
    const chk = document.getElementById('chk' + idx);
    if (chk.checked) {
        jornadaSeleccionados.add(idx);
        li.classList.add('selected');
    } else {
        jornadaSeleccionados.delete(idx);
        li.classList.remove('selected');
    }
    actualizarBotonAnalizar();
}

function actualizarBotonAnalizar() {
    const n = jornadaSeleccionados.size;
    document.getElementById('selCount').textContent = n + ' partido' + (n === 1 ? '' : 's') + ' seleccionado' + (n === 1 ? '' : 's');
    const btn = document.getElementById('btnAnalizarSeleccionados');
    btn.disabled = n === 0;
    btn.textContent = 'Analizar Seleccionados (' + n + ')';
}

async function analizarSeleccionados() {
    const indices = Array.from(jornadaSeleccionados).sort();
    const eventos = indices.map(i => jornadaEventos[i]);

    document.getElementById('loadingMulti').style.display = 'block';
    document.getElementById('btnAnalizarSeleccionados').disabled = true;
    document.getElementById('resultadoMulti').innerHTML = '';

    const resultados = [];

    try {
        for (let i = 0; i < eventos.length; i++) {
            const ev = eventos[i];
            const home = ev.homeTeam?.name || '?';
            const away = ev.awayTeam?.name || '?';
            stepM(`Analizando partido ${i+1}/${eventos.length}...`, home + ' vs ' + away);

            try {
                const resultado = await fetchResultadoCompleto(ev, ev.homeTeam?.id, ev.awayTeam?.id);
                resultados.push(resultado);
            } catch(err) {
                console.warn('Error en', home, 'vs', away, err);
            }

            await sleep(500);
        }

        stepM('Generando análisis IA para cada partido...');
        document.getElementById('loadingMulti').style.display = 'none';
        renderMultiResultados(resultados);

    } catch(err) {
        document.getElementById('loadingMulti').style.display = 'none';
        document.getElementById('resultadoMulti').innerHTML =
            '<div class="card error-box">Error: ' + err.message + '</div>';
    } finally {
        document.getElementById('btnAnalizarSeleccionados').disabled = false;
    }
}

function renderMultiResultados(resultados) {
    const container = document.getElementById('resultadoMulti');
    container.innerHTML = '';

    resultados.forEach((r, i) => {
        const m = r.meta;
        const divId = 'multi-ia-body-' + i;
        const loadId = 'multi-ia-load-' + i;

        const div = document.createElement('div');
        div.className = 'multi-partido-card';
        div.innerHTML = `
            <div class="multi-partido-header">
                <span>${m.eqA} vs ${m.eqB}</span>
                <small>${m.competicion || ''}</small>
            </div>
            <div class="multi-partido-body">
                <div class="ia-card" style="margin:0">
                    <h2 style="font-size:14px;margin-bottom:8px">🤖 Análisis Kimi K2 <span class="ia-badge">en curso...</span></h2>
                    <div class="ia-loading" id="${loadId}">
                        <div class="ia-spinner"></div>
                        <span>Analizando ${m.eqA} vs ${m.eqB}...</span>
                    </div>
                    <div class="ia-body" id="${divId}" style="display:none"></div>
                </div>
            </div>
        `;
        container.appendChild(div);
    });

    // Agregar placeholder para el análisis combinado
    const combDiv = document.createElement('div');
    combDiv.id = 'combinado-bloque';
    combDiv.className = 'ia-card';
    combDiv.style.display = 'none';
    combDiv.innerHTML = `
        <h2>🏆 Análisis Combinado <span class="ia-badge">Jornada completa</span></h2>
        <div class="ia-loading" id="comb-loading">
            <div class="ia-spinner"></div>
            <span>Esperando análisis individuales...</span>
        </div>
        <div class="ia-body" id="comb-body" style="display:none"></div>
    `;
    container.appendChild(combDiv);

    // Analizar cada partido individualmente (en secuencia para no saturar la API)
    (async () => {
        const textos = [];
        for (let i = 0; i < resultados.length; i++) {
            const texto = await pedirAnalisisIA(resultados[i], 'multi-ia-body-' + i, 'multi-ia-load-' + i, false);
            textos.push({ partido: resultados[i].meta.eqA + ' vs ' + resultados[i].meta.eqB, texto });
            await sleep(1000);
        }

        // Ahora análisis combinado
        document.getElementById('combinado-bloque').style.display = 'block';
        await pedirAnalisisCombinado(resultados, textos, 'comb-body', 'comb-loading');
    })();
}

   HELPERS DATOS

function firstTeam(data, fallback) {
    if (!data?.results) return null;
    for (const item of data.results) {
        if (item.type === 'team') {
            const e = item.entity;
            return { id: e.id, nombre: e.name };
        }
    }
    return null;
}

async function buscarPartido(idA, idB) {
    for (const pag of [0, 1]) {
        const data = await sfGet('/team/' + idA + '/events/next/' + pag);
        if (!data?.events) continue;
        for (const ev of data.events) {
            if ([ev.homeTeam?.id, ev.awayTeam?.id].includes(idB)) return ev;
        }
        await sleep(300);
    }
    return null;
}

function finished(events) {
    return (events || []).filter(e => e?.status?.code === 100);
}

async function fetchStats(events, teamId) {
    const corners = [], amarillas = [];
    for (const ev of events) {
        const data = await sfGet('/event/' + ev.id + '/statistics');
        if (!data?.statistics) { await sleep(300); continue; }
        const lado = ev.homeTeam?.id === teamId ? 'home' : 'away';
        for (const grupo of data.statistics)
            for (const grp of (grupo.groups || []))
                for (const st of (grp.statisticsItems || [])) {
                    const n = (st.name || '').toLowerCase();
                    const v = parseFloat((st[lado] || '0').toString().replace(',','.')) || 0;
                    if (n.includes('corner')) corners.push(v);
                    if (n.includes('yellow')) amarillas.push(v);
                }
        await sleep(300);
    }
    const avg = arr => arr.length ? +(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : null;
    return { corners: avg(corners), amarillas: avg(amarillas) };
}

function forma(events, teamId) {
    const list = finished(events).slice(-5);
    const badges = [], detalle = [];
    for (const ev of list) {
        const local = ev.homeTeam?.id === teamId;
        const gf = (local ? ev.homeScore?.current : ev.awayScore?.current) || 0;
        const gc = (local ? ev.awayScore?.current : ev.homeScore?.current) || 0;
        badges.push(gf > gc ? 'V' : gf === gc ? 'E' : 'D');
        const ts    = ev.startTimestamp;
        const fecha = ts ? new Date(ts*1000).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}) : '';
        detalle.push({ rival: local ? ev.awayTeam?.name : ev.homeTeam?.name,
                       res: gf+'-'+gc, fecha, local });
    }
    return { badges, detalle };
}

function calcStats(events, teamId) {
    const list = finished(events).slice(-5);
    if (!list.length) return {};
    const gf = [], gc = [];
    for (const ev of list) {
        const local = ev.homeTeam?.id === teamId;
        gf.push((local ? ev.homeScore?.current : ev.awayScore?.current) || 0);
        gc.push((local ? ev.awayScore?.current : ev.homeScore?.current) || 0);
    }
    const n = gf.length, sgf = gf.reduce((a,b)=>a+b,0), sgc = gc.reduce((a,b)=>a+b,0);
    return { gf: sgf, gc: sgc, pgf: +(sgf/n).toFixed(2), pgc: +(sgc/n).toFixed(2),
             cs: gc.filter(g=>g===0).length, n };
}

function parseLineups(data) {
    if (!data) return { confirmadas:false, fA:'', fB:'', tA:[], tB:[] };
    const parse = side => {
        const eq = data[side] || {};
        return { form: eq.formation || '',
                 tit: (eq.players||[]).filter(p=>!p.substitute).map(p=>({
                     nombre: p?.player?.name||'', pos: p?.position||'',
                     num: p?.shirtNumber||'', cap: !!p?.captain })) };
    };
    const h = parse('home'), a = parse('away');
    return { confirmadas: !!data.confirmed, fA: h.form, fB: a.form, tA: h.tit, tB: a.tit };
}

function parseH2H(data, nomA, nomB) {
    if (!data?.events) return { list:[], res:{vA:0,vB:0,emp:0,n:0} };
    let vA=0,vB=0,emp=0;
    const list = data.events.slice(0,10).map(ev => {
        const home = ev.homeTeam?.name||'', away = ev.awayTeam?.name||'';
        const sh = ev.homeScore?.current||0, sa = ev.awayScore?.current||0;
        const ts = ev.startTimestamp;
        const fecha = ts ? new Date(ts*1000).toLocaleDateString('es-ES') : '';
        const aEsHome = nomA.toLowerCase().slice(0,5).split('').some(c=>home.toLowerCase().includes(c));
        if      (sh > sa) aEsHome ? vA++ : vB++;
        else if (sh < sa) aEsHome ? vB++ : vA++;
        else emp++;
        return { home, away, sc: sh+'-'+sa, fecha, comp: ev.tournament?.name||'' };
    });
    return { list, res:{vA,vB,emp,n:list.length} };
}

async function fetchResultadoCompleto(evento, teamAId, teamBId) {
    const eventId = evento.id;
    const eqANom  = evento.homeTeam?.name || '?';
    const eqBNom  = evento.awayTeam?.name || '?';

    step('Obteniendo forma y alineaciones...', eqANom + ' vs ' + eqBNom);

    const [lastA, lastB, lineups, eventData, h2hData] = await Promise.all([
        sfGet('/team/' + teamAId + '/events/last/0'),
        sfGet('/team/' + teamBId + '/events/last/0'),
        sfGet('/event/' + eventId + '/lineups'),
        sfGet('/event/' + eventId),
        sfGet('/event/' + eventId + '/h2h'),
    ]);

    step('Calculando corners y tarjetas...', 'Analizando últimos 5 partidos...');
    const evA = finished(lastA?.events).slice(-5);
    const evB = finished(lastB?.events).slice(-5);
    const [statsA, statsB] = await Promise.all([
        fetchStats(evA, teamAId),
        fetchStats(evB, teamBId),
    ]);

    const ts      = evento.startTimestamp;
    const fecha   = ts ? new Date(ts * 1000).toISOString() : '';
    const arbitro = eventData?.event?.referee?.name || '';
    const estadio = eventData?.event?.venue?.stadium?.name || '';
    const ciudad  = eventData?.event?.venue?.city?.name || '';

    const roundInfo   = evento.roundInfo || {};
    const rondaNombre = roundInfo.name || '';
    const rondaNum    = roundInfo.round || '';
    const esEliminatoria = !!rondaNombre && isNaN(rondaNombre);
    const esIda    = rondaNombre.toLowerCase().includes('1st leg') || rondaNombre.toLowerCase().includes('ida');
    const esVuelta = rondaNombre.toLowerCase().includes('2nd leg') || rondaNombre.toLowerCase().includes('vuelta');

    return {
        meta: { eqA: eqANom, eqB: eqBNom,
                competicion: evento.tournament?.name || '',
                fecha, estadio, arbitro, ciudad,
                rondaNombre, rondaNum, esEliminatoria, esIda, esVuelta },
        alin: parseLineups(lineups),
        forma: {
            fA: forma(lastA?.events, teamAId),
            fB: forma(lastB?.events, teamBId),
        },
        stats: {
            sA: calcStats(lastA?.events, teamAId),
            sB: calcStats(lastB?.events, teamBId),
        },
        corners: { a: statsA.corners, b: statsB.corners },
        amarillas: { a: statsA.amarillas, b: statsB.amarillas },
        h2h: parseH2H(h2hData, eqANom, eqBNom),
    };
}

function recomendaciones(r) {
    const recs = [];
    const sA=r.stats.sA, sB=r.stats.sB, fA=r.forma.fA.badges;
    const cA=r.corners.a, cB=r.corners.b, h=r.h2h.res;

    if (sA.pgc>0.8 && sB.pgf>0.8)
        recs.push({tipo:'Ambos Equipos Marcan (SI)',
            razon:`Local recibe ${sA.pgc?.toFixed(1)} goles/partido · Visitante marca ${sB.pgf?.toFixed(1)}`,
            conf:'Media', cuota:'1.75–1.90'});

    if (cA && cB && cA+cB>9)
        recs.push({tipo:'Más de 9.5 corners',
            razon:`Promedio combinado: ${(cA+cB).toFixed(1)} corners/partido`,
            conf: cA+cB>10.5 ? 'Media-Alta':'Media', cuota:'1.75–1.85'});

    const vic = fA.filter(x=>x==='V').length;
    if (vic>=3)
        recs.push({tipo:'Victoria Local',
            razon:`${r.meta.eqA} ganó ${vic} de sus últimos ${fA.length} partidos`,
            conf: vic>=4?'Media-Alta':'Media', cuota:'1.70–1.90'});

    if (sA.pgf && sB.pgf && sA.pgf+sB.pgf>2.8)
        recs.push({tipo:'Más de 2.5 goles',
            razon:`Promedios ofensivos: ${sA.pgf?.toFixed(1)} + ${sB.pgf?.toFixed(1)} goles/partido`,
            conf:'Media', cuota:'1.75–1.85'});

    if (h.n>=5 && h.vA/h.n>=0.6)
        recs.push({tipo:'Ventaja histórica Local',
            razon:`${r.meta.eqA} ganó ${h.vA}/${h.n} enfrentamientos directos`,
            conf:'Media', cuota:'1.75–1.90'});

    if (!recs.length)
        recs.push({tipo:'Sin recomendación clara',
            razon:'Partido equilibrado o datos insuficientes',
            conf:'Baja', cuota:'N/A'});
    return recs;
}

function sr(l,v_) { return `<div class="srow"><span class="slbl">${l}</span><span class="sval">${val(v_)}</span></div>`; }

function badges(arr) {
    if (!arr?.length) return '<span style="color:#aaa">Sin datos</span>';
    return arr.map(r=>`<span class="badge badge-${r}">${r}</span>`).join('');
}
function detHTML(arr) {
    if (!arr?.length) return '';
    return arr.map(d=>`<div class="fitem">${d.fecha} ${d.local?'vs':'en'} ${d.rival||'?'} — <b>${d.res}</b></div>`).join('');
}
function ccls(c) {
    if (!c) return 'cb';
    return c.toLowerCase().includes('alta')?'ca':c.toLowerCase().includes('media')?'cm':'cb';
}
function rcls(c) {
    if (!c) return 'rec-baja';
    return c.toLowerCase().includes('alta')?'rec-alta':c.toLowerCase().includes('media')?'rec-media':'rec-baja';
}

    let html = '';

    if (mostrarGuardar) {

    }

    html += `
    <div class="card match-header">

            <div class="team-name">${m.eqA}</div>
            <div class="vs-badge">VS</div>

        html += `<div class="card"><h2>Alineaciones ${al.confirmadas?'✓ Confirmadas':'(Previstas)'}</h2><div class="two-col">`;

        html += `</div></div>`;

    html += `<div class="card"><h2>Forma Reciente (últimos 5)</h2><div class="two-col">

    </div></div>`;

    const sA=st.sA, sB=st.sB;
    if (Object.keys(sA).length||Object.keys(sB).length)
        html += `<div class="card"><h2>Estadísticas (últimos 5 partidos)</h2><div class="two-col">
        <div><div class="col-hdr">${m.eqA}</div>${sr('Goles marcados',sA.gf)}${sr('Goles recibidos',sA.gc)}${sr('Promedio GF',sA.pgf)}${sr('Promedio GC',sA.pgc)}${sr('Clean sheets',sA.cs)}</div>
        <div><div class="col-hdr">${m.eqB}</div>${sr('Goles marcados',sB.gf)}${sr('Goles recibidos',sB.gc)}${sr('Promedio GF',sB.pgf)}${sr('Promedio GC',sB.pgc)}${sr('Clean sheets',sB.cs)}</div>
        </div></div>`;

    if (co.a||co.b||am.a||am.b) {
        const tot = co.a&&co.b ? (co.a+co.b).toFixed(1) : null;
        html += `<div class="card"><h2>Corners y Tarjetas</h2><div class="two-col">
        <div><div class="col-hdr">Corners (prom/partido)</div>${sr(m.eqA,co.a)}${sr(m.eqB,co.b)}${tot?sr('Total combinado',tot):''}</div>
        <div><div class="col-hdr">Amarillas (prom/partido)</div>${sr(m.eqA,am.a)}${sr(m.eqB,am.b)}</div>
        </div></div>`;

    if (h.list.length) {
        const res=h.res;
        html += `<div class="card"><h2>Historial Directo (H2H)</h2>
        <div class="h2h-sum">
            <div class="h2h-box"><div class="h2h-num">${res.vA}</div><div class="h2h-lbl">${m.eqA}</div></div>
            <div class="h2h-box"><div class="h2h-num">${res.emp}</div><div class="h2h-lbl">Empates</div></div>
            <div class="h2h-box"><div class="h2h-num">${res.vB}</div><div class="h2h-lbl">${m.eqB}</div></div>
        </div>
        <div class="h2h-list">${h.list.slice(0,8).map(p=>`
        <div class="h2h-item"><span>${p.fecha}</span>

        <span class="h2h-comp">${p.comp}</span></div>`).join('')}</div></div>`;
    }

    html += `<div class="card"><h2>Recomendaciones de Apuesta</h2>
    <p style="font-size:12px;color:#aaa;margin-bottom:12px">Solo orientativo. Las apuestas conllevan riesgo de pérdida económica.</p>`;
    recs.forEach(rec => {
        html += `<div class="rec-card ${rcls(rec.conf)}">
        <div class="rec-tipo">${rec.tipo}</div>
        <div class="rec-razon">${rec.razon}</div>
        <div class="rec-meta">
            <span>Confianza: <b class="rc ${ccls(rec.conf)}">${rec.conf}</b></span>
            <span>Cuota: <b>${rec.cuota}</b></span>
        </div></div>`;
    });
    html += `</div>`;

    html += `<div class="ia-card" id="ia-bloque">
        <h2>🤖 Análisis de IA <span class="ia-badge">Kimi K2</span></h2>
        <div class="ia-loading" id="ia-loading">
            <div class="ia-spinner"></div>
            <span>Kimi está analizando todos los datos del partido...</span>
        </div>
        <div class="ia-body" id="ia-body" style="display:none"></div>
    </div>`;

    const el = document.getElementById(containerId);
    el.innerHTML = html;
    el.style.display = 'block';

    // Guardar resultado actual para poder guardarlo en historial
    window._currentResultado = r;
}

   ANÁLISIS IA — Partido individual y multi-partido

function buildPrompt(r) {
    const m = r.meta, fo = r.forma, st = r.stats, co = r.corners, am = r.amarillas, al = r.alin, h = r.h2h;
    const sA = st.sA || {}, sB = st.sB || {};
    const h2h_res = h.res || {};
    const h2h_str = `${m.eqA} ${h2h_res.vA||0} - Empates ${h2h_res.emp||0} - ${m.eqB} ${h2h_res.vB||0}`;
    const h2h_det = (h.list||[]).slice(0,6).map(p=>`  ${p.fecha} ${p.home} ${p.sc} ${p.away} (${p.comp})`).join('\n');

    const formaStr = (badges, detalle) => {
        const b = (badges||[]).join(' ') || 'Sin datos';
        const d = (detalle||[]).map(x=>`  ${x.fecha} ${x.local?'vs':'en'} ${x.rival}: ${x.res}`).join('\n');
        return b + (d ? '\n'+d : '');
    };
    const titStr = (lista) => lista && lista.length
        ? lista.map(j=>`${j.num||''}.${j.nombre||'?'}(${j.pos||''})`).join(', ')
        : 'No disponible';

    const cornTotal = co.a && co.b ? (co.a + co.b).toFixed(1) : 'N/D';

    let tipoPartidoBloque = '';
    if (m.esEliminatoria) {
        if (m.esIda) {
            tipoPartidoBloque = `\n⚠️ TIPO DE PARTIDO: ES PARTIDO DE IDA (hay vuelta pendiente)
Ronda: ${m.rondaNombre}
IMPLICACIONES TÁCTICAS: Los equipos pueden especular con el resultado, proteger jugadores de tarjetas y lesiones, buscar no perder en casa más que ganar amplio. El resultado de la ida condiciona completamente la vuelta.
IMPLICACIONES PARA APUESTAS: Menor número de goles esperado (los equipos son más cautelosos), más posibilidad de empate o victoria mínima, el handicap asiático puede ser más interesante que el 1X2.`;
        } else if (m.esVuelta) {
            tipoPartidoBloque = `\n⚠️ TIPO DE PARTIDO: ES PARTIDO DE VUELTA (eliminatoria)
Ronda: ${m.rondaNombre}
IMPLICACIONES TÁCTICAS: El resultado de la vuelta se analiza en conjunto con la ida. El equipo que perdió la ida necesita remontar, lo que puede generar más ataques y más goles. Verificá el resultado de la ida en el H2H y calculá quién clasifica con qué resultados.`;
        } else {
            tipoPartidoBloque = `\n⚠️ TIPO DE PARTIDO: PARTIDO DE ELIMINATORIA/COPA
Ronda: ${m.rondaNombre || m.rondaNum}
IMPLICACIONES: Verificá si es ida, vuelta o partido único eliminatorio. La táctica y las apuestas cambian completamente según el formato.`;
        }
    }

    let contextoCiudad = '';
    if (m.ciudad) {
        contextoCiudad = `Ciudad del estadio: ${m.ciudad}`;
        const ciudadesAltura = ['la paz', 'quito', 'bogotá', 'bogota', 'cusco', 'cuzco',
            'potosí', 'potosi', 'oruro', 'huancayo', 'sucre', 'cochabamba', 'medellín', 'medellin'];
        const ciudadLow = m.ciudad.toLowerCase();
        if (ciudadesAltura.some(c => ciudadLow.includes(c))) {
            contextoCiudad += `\n🏔️ ALERTA ALTURA: ${m.ciudad} está a gran altura sobre el nivel del mar. Esto impacta directamente en el ritmo de juego (menor presión), resistencia física de los visitantes no acostumbrados, mayor desgaste, posibles cambios tácticos. El local tiene ventaja significativa por adaptación.`;
        }
    }

    return `Haceme un análisis profundo del partido ${m.eqA} vs ${m.eqB}.

A continuación tenés todos los datos recopilados de Sofascore para este partido. Usá ESTOS datos como base y complementá con tu conocimiento del fútbol:

═══════════════════════════════════════
DATOS DEL PARTIDO (fuente: Sofascore)
═══════════════════════════════════════
Competición: ${m.competicion||'N/D'}
Fecha: ${m.fecha||'N/D'}
${m.estadio ? 'Estadio: '+m.estadio : ''}
${contextoCiudad ? contextoCiudad : ''}
${m.arbitro ? 'Árbitro: '+m.arbitro : 'Árbitro: sin confirmar'}
${tipoPartidoBloque}

FORMA RECIENTE — ${m.eqA} (últimos 5):
${formaStr(fo.fA.badges, fo.fA.detalle)}

FORMA RECIENTE — ${m.eqB} (últimos 5):
${formaStr(fo.fB.badges, fo.fB.detalle)}

ESTADÍSTICAS ÚLTIMOS 5 PARTIDOS:
${m.eqA}: ${sA.gf||'?'} goles marcados, ${sA.gc||'?'} recibidos | Prom: ${sA.pgf||'?'} GF / ${sA.pgc||'?'} GC | Clean sheets: ${sA.cs||'?'}
${m.eqB}: ${sB.gf||'?'} goles marcados, ${sB.gc||'?'} recibidos | Prom: ${sB.pgf||'?'} GF / ${sB.pgc||'?'} GC | Clean sheets: ${sB.cs||'?'}

CORNERS PROMEDIO (últimos 5):
${m.eqA}: ${co.a||'N/D'} corners/partido | ${m.eqB}: ${co.b||'N/D'} corners/partido
Total combinado: ${cornTotal} corners/partido

TARJETAS AMARILLAS PROMEDIO (últimos 5):
${m.eqA}: ${am.a||'N/D'} | ${m.eqB}: ${am.b||'N/D'}

ALINEACIONES (Sofascore):
${m.eqA} (${al.fA||'formación no confirmada'}): ${titStr(al.tA)}
${m.eqB} (${al.fB||'formación no confirmada'}): ${titStr(al.tB)}

HISTORIAL DIRECTO (H2H):
${h2h_str}
${h2h_det}
═══════════════════════════════════════

⚠️ ATENCIÓN ESPECIAL ANTES DE ANALIZAR:
- Si es partido de IDA o VUELTA de una eliminatoria, analizá TODO en función de eso (táctica, apuestas, mercados)
- Si el estadio está en una ciudad a gran altura (>1500m sobre el nivel del mar), mencionalo y analizá su impacto real en el juego
- Si hay condiciones climáticas o geográficas especiales del estadio, incluilas
- NUNCA asumas que es un partido de liga regular sin antes verificar el tipo de competición
- Usá el H2H para detectar si ya jugaron ida y cuál fue el resultado, para analizar la vuelta correctamente

Incluí EXACTAMENTE todo esto en tu respuesta:

1. 📊 CONTEXTO DEL PARTIDO
   - Competición, fecha, horario y estadio
   - Árbitro (nombre completo y su estilo: cardista, permisivo, estricto)
   - Qué se juega cada equipo (motivación, presión, necesidad de puntos)
   - Si es ida/vuelta: explicar qué implica tácticamente y para las apuestas
   - Si el estadio tiene condiciones especiales (altura, clima, superficie): analizarlo

2. 📈 POSICIONES Y FORMA
   - Tabla de posiciones actual en la ${m.competicion||'competición'}
   - Forma de últimos 5 partidos con resultados detallados
   - Rendimiento local/visitante específico

3. ⚽ ALINEACIONES CONFIRMADAS/PREDICHAS
   - Formación táctica y titulares por posición
   - BAJAS CONFIRMADAS (lesiones, suspensiones, dudas) con detalle

4. 📊 ESTADÍSTICAS CLAVE
   - Basate en los datos de Sofascore que te di
   - xG estimado, posesión, clean sheets y tendencia defensiva

5. 🎯 ANÁLISIS TÁCTICO
   - Sistema de juego, fortalezas y debilidades de cada equipo
   - Jugadores clave y matchups individuales importantes

6. 🚩 ANÁLISIS DE CÓRNERS ⭐
   **${m.eqA}:** Promedio ${co.a||'N/D'} corners/partido. Tendencia 1er vs 2do tiempo.
   **${m.eqB}:** Promedio ${co.b||'N/D'} corners/partido. Tendencia 1er vs 2do tiempo.
   **COMBINADO:** Total ${cornTotal} corners/partido.
   - % estimado Over 8.5, 9.5, 10.5 corners totales
   - % estimado Over 4.5 corners al descanso
   - Mercados recomendados: Over/Under corners 1er tiempo y partido completo

7. ⚽ ANÁLISIS DE GOLES
   - ${m.eqA} promedia ${sA.pgf||'?'} GF y ${sA.pgc||'?'} GC | ${m.eqB} promedia ${sB.pgf||'?'} GF y ${sB.pgc||'?'} GC
   - % estimado Over 1.5, 2.5, 3.5 goles
   - BTTS probabilidad estimada. Minutos donde más marcan.

8. 🟨 ANÁLISIS DE TARJETAS Y ÁRBITRO ⭐
   - ${m.arbitro ? 'Árbitro: '+m.arbitro+'. Su historial, estilo y promedio de tarjetas.' : 'Árbitro sin confirmar, usar promedio de la competición.'}
   - ${m.eqA} promedia ${am.a||'N/D'} amarillas | ${m.eqB} promedia ${am.b||'N/D'} amarillas
   - % estimado Over 3.5, 4.5, 5.5 tarjetas totales

   - 1X2, handicap, over/under goles, BTTS, corners, tarjetas
   - Cuotas aproximadas y seguridad ⭐ del 1 al 5

10. ⚠️ RIESGOS IDENTIFICADOS
    | Riesgo | Probabilidad | Impacto |
    |--------|-------------|---------|
    (3-4 riesgos reales del partido)

11. ✅ VEREDICTO FINAL
    Tabla resumen con mejores apuestas, cuota estimada, confianza y recomendación.

}

// Devuelve el texto completo del análisis (para el análisis combinado)
async function pedirAnalisisIA(r, bodyId, loadId, guardar) {
    const loading = document.getElementById(loadId);
    const body    = document.getElementById(bodyId);

    if (!KIMI_KEY) {
        if (loading) loading.style.display = 'none';
        if (body) { body.style.display='block'; body.innerHTML='<div class="ia-error">⚠️ KIMI_API_KEY no configurada</div>'; }
        return '';
    }

    try {
        const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + KIMI_KEY,
                'Content-Type': 'application/json',
                'HTTP-Referer': window.location.origin,
            },
            body: JSON.stringify({
                model: 'moonshotai/kimi-k2',
                messages: [{ role: 'user', content: buildPrompt(r) }],
                temperature: 0.4,
                max_tokens: 6000,
                stream: true,
            }),
        });

        if (!resp.ok) {
            const err = await resp.text();
            throw new Error('OpenRouter ' + resp.status + ': ' + err.slice(0,100));
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let textoCompleto = '';

        if (loading) loading.style.display = 'none';
        if (body) { body.style.display = 'block'; body.innerHTML = '<span style="color:#8888aa">▍</span>'; }

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const dataStr = line.slice(6).trim();
                if (dataStr === '[DONE]') break;
                try {
                    const chunk = JSON.parse(dataStr);
                    const content = chunk?.choices?.[0]?.delta?.content || '';
                    if (content) {
                        textoCompleto += content;
                        if (body) body.innerHTML = markdownToHtml(textoCompleto) + '<span style="color:#a78bfa">▍</span>';
                    }
                } catch(_) {}
            }
        }

        if (body && textoCompleto) body.innerHTML = markdownToHtml(textoCompleto);
        else if (body) body.innerHTML = '<div class="ia-error">⚠️ Sin respuesta del modelo</div>';

        // Auto-guardar en historial si se pide
        if (guardar && textoCompleto && window._currentResultado) {
            window._currentKimiText = textoCompleto;
        }

        return textoCompleto;

    } catch(err) {
        if (loading) loading.style.display = 'none';
        if (body) {
            body.style.display = 'block';
            body.innerHTML = `<div class="ia-error">⚠️ Error: ${err.message}</div>`;
        }
        return '';
    }
}

    } catch(err) {
        if (loading) loading.style.display = 'none';
        if (body) { body.style.display = 'block'; body.innerHTML = `<div class="ia-error">⚠️ Error: ${err.message}</div>`; }
    }
}

/* ════════════════════════════════════════════════════════════════════════════
   MARKDOWN RENDERER
════════════════════════════════════════════════════════════════════════════ */
function markdownToHtml(text) {
    const secciones = text.split(/(?=\n\d+\.\s+\*\*)/);
    if (secciones.length > 1) {
        return secciones.map(sec => {
            const matchTitulo = sec.match(/^\n?(\d+\.\s+\*\*([^*]+)\*\*)([\s\S]*)/);
            if (matchTitulo) {
                const titulo = matchTitulo[2].trim();
                const cuerpo = procesarMarkdown(matchTitulo[3]);
                return `<div class="ia-seccion">
                    <div class="ia-seccion-titulo">${titulo}</div>
                    <div>${cuerpo}</div>
                </div>`;
            }
            return `<p>${procesarMarkdown(sec)}</p>`;
        }).join('');
    }
    return procesarMarkdown(text);
}

function procesarMarkdown(text) {
    return text
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/^[-•]\s+(.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
        .replace(/\n\n+/g, '</p><p>')
        .replace(/\n/g, '<br>')
        .replace(/^/, '<p>').replace(/$/, '</p>');
}

/* ════════════════════════════════════════════════════════════════════════════
   HISTORIAL
════════════════════════════════════════════════════════════════════════════ */

async function guardarAnalisis() {
    const btn = document.getElementById('saveBtn');
    if (!btn || btn.classList.contains('saved')) return;

    const r = window._currentResultado;
    const kimiText = window._currentKimiText || '';
    if (!r) return;

    btn.textContent = '💾 Guardando...';
    btn.style.opacity = '0.6';

    try {
        const resp = await fetch('/historial', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                partido: r.meta.eqA + ' vs ' + r.meta.eqB,
                competicion: r.meta.competicion || '',
                fecha_partido: r.meta.fecha || '',
                stats_json: r,
                analisis_ia: kimiText,
            }),
        });
        if (resp.ok) {
            btn.textContent = '✅ Guardado';
            btn.classList.add('saved');
        } else {
            btn.textContent = '❌ Error al guardar';
            btn.style.opacity = '1';
        }
    } catch(err) {
        btn.textContent = '❌ Error: ' + err.message;
        btn.style.opacity = '1';
    }
}

async function loadHistorial() {
    const content = document.getElementById('histListContent');
    const detail  = document.getElementById('histDetail');
    detail.style.display = 'none';
    document.getElementById('histListCard').style.display = 'block';
    content.innerHTML = '<div class="hist-empty">Cargando...</div>';

    try {
        const resp = await fetch('/historial');
        const lista = await resp.json();

        if (!lista.length) {
            content.innerHTML = '<div class="hist-empty">No hay análisis guardados todavía.<br>Analizá un partido y guardalo con el botón 💾.</div>';
            return;
        }

        content.innerHTML = lista.map(item => {
            const fecha = item.fecha_analisis
                ? new Date(item.fecha_analisis * 1000).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' })
                : '—';
            const fechaPartido = item.fecha_partido
                ? new Date(item.fecha_partido).toLocaleDateString('es-ES', { dateStyle: 'medium' })
                : '';
            return `<div class="hist-item" onclick="verHistorial(${item.id})">
                <div class="hist-item-info">
                    <div class="hist-item-name">${item.partido}</div>
                    <div class="hist-item-meta">${item.competicion || ''}${fechaPartido ? ' · ' + fechaPartido : ''} · Guardado: ${fecha}</div>
                </div>
                <div class="hist-item-actions">
                    <button class="btn-sm btn-danger" onclick="event.stopPropagation(); borrarHistorial(${item.id}, this)">🗑️</button>
                </div>
            </div>`;
        }).join('');

    } catch(err) {
        content.innerHTML = '<div class="hist-empty">Error al cargar historial: ' + err.message + '</div>';
    }
}

async function verHistorial(id) {
    document.getElementById('histListCard').style.display = 'none';
    const detail = document.getElementById('histDetail');
    const content = document.getElementById('histDetailContent');
    detail.style.display = 'block';
    content.innerHTML = '<div class="card"><div class="hist-empty">Cargando análisis...</div></div>';

    try {
        const resp = await fetch('/historial/' + id);
        const item = await resp.json();

        if (item.error) throw new Error(item.error);

        const fecha = item.fecha_analisis
            ? new Date(item.fecha_analisis * 1000).toLocaleString('es-ES', { dateStyle: 'full', timeStyle: 'short' })
            : '—';

        let html = `<div class="card match-header">
            <div class="vs-row">
                <div class="team-name" style="font-size:18px">${item.partido}</div>
            </div>
            <div class="match-meta">${item.competicion || ''}<br>Guardado: ${fecha}</div>
            <span class="source-ok">📁 Historial</span>
        </div>`;

        // Si tenemos stats_json, renderizar el partido completo
        if (item.stats_json && typeof item.stats_json === 'object') {
            // Renderizar las tarjetas de stats
            const r = item.stats_json;
            const m = r.meta, fo = r.forma, st = r.stats, co = r.corners, am = r.amarillas, h = r.h2h;
            if (fo && fo.fA) {
                html += `<div class="card"><h2>Forma Reciente</h2><div class="two-col">
                <div><div class="col-hdr">${m.eqA}</div><div class="forma-row">${badges(fo.fA.badges)}</div></div>
                <div><div class="col-hdr">${m.eqB}</div><div class="forma-row">${badges(fo.fB.badges)}</div></div>
                </div></div>`;
            }
            if (co && (co.a || co.b)) {
                const tot = co.a&&co.b ? (co.a+co.b).toFixed(1) : null;
                html += `<div class="card"><h2>Corners y Tarjetas</h2><div class="two-col">
                <div><div class="col-hdr">Corners</div>${sr(m.eqA,co.a)}${sr(m.eqB,co.b)}${tot?sr('Total',tot):''}</div>
                <div><div class="col-hdr">Amarillas</div>${sr(m.eqA,am.a)}${sr(m.eqB,am.b)}</div>
                </div></div>`;
            }
        }

        // Mostrar análisis IA guardado
        if (item.analisis_ia) {
            html += `<div class="ia-card">
                <h2>🤖 Análisis de IA <span class="ia-badge">Kimi K2 · Guardado</span></h2>
                <div class="ia-body">${markdownToHtml(item.analisis_ia)}</div>
            </div>`;
        }

        content.innerHTML = html;

    } catch(err) {
        content.innerHTML = '<div class="card error-box">Error: ' + err.message + '</div>';
    }
}

async function borrarHistorial(id, btn) {
    if (!confirm('¿Borrar este análisis del historial?')) return;
    btn.disabled = true;
    try {
        await fetch('/historial/' + id, { method: 'DELETE' });
        loadHistorial();
    } catch(err) {
        alert('Error al borrar: ' + err.message);
        btn.disabled = false;
    }
}

function cerrarHistDetail() {
    document.getElementById('histDetail').style.display = 'none';
    document.getElementById('histListCard').style.display = 'block';
}

    const el = document.getElementById('resultado');
    el.innerHTML = `<div class="card error-box">${msg}</div>`;
    el.style.display = 'block';
    document.getElementById('loading').style.display = 'none';

}
