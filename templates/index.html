<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Partidos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 16px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 24px; border-radius: 14px;
            margin-bottom: 16px; text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 6px; }
        .header p  { opacity: .8; font-size: 13px; }
        .card {
            background: white; border-radius: 12px;
            padding: 20px; margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,.07);
        }
        .card h2 { font-size: 16px; color: #333; margin-bottom: 14px;
            border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; font-size: 13px; }
        input, select {
            width: 100%; padding: 10px 12px;
            border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:disabled { opacity: .55; cursor: not-allowed; }

        /* loading */
        .loading { display: none; text-align: center; padding: 36px; }
        .spinner {
            border: 4px solid #f0f0f0; border-top: 4px solid #667eea;
            border-radius: 50%; width: 44px; height: 44px;
            animation: spin 1s linear infinite; margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loadingMsg { color: #666; font-size: 13px; margin-top: 6px; }

        .resultado { display: none; }

        /* header partido */
        .match-header { text-align: center; }
        .vs-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 14px 0; }
        .team-name { font-size: 20px; font-weight: 700; color: #222; }
        .vs-badge { background: #667eea; color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; }
        .match-meta { color: #666; font-size: 13px; line-height: 1.9; }
        .source-badge { display: inline-block; font-size: 11px; padding: 3px 10px;
            border-radius: 20px; font-weight: 600; margin-top: 6px;
            background: #e8f4fd; color: #1a73e8; }

        /* dos columnas */
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 580px) { .two-col { grid-template-columns: 1fr; } }
        .col-header { font-weight: 700; color: #667eea; font-size: 12px;
            text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }

        /* forma */
        .forma-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 7px; }
        .badge { width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 12px; color: white; }
        .badge-V { background: #4caf50; }
        .badge-E { background: #ff9800; }
        .badge-D { background: #f44336; }
        .forma-detalle { font-size: 12px; color: #777; }
        .forma-item { margin-bottom: 2px; }

        /* stats */
        .stat-row { display: flex; justify-content: space-between; align-items: center;
            padding: 7px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
        .stat-row:last-child { border-bottom: none; }
        .stat-lbl { color: #555; }
        .stat-val { font-weight: 600; color: #333; }

        /* h2h */
        .h2h-summary { display: flex; gap: 8px; margin-bottom: 12px; text-align: center; }
        .h2h-box { flex: 1; background: #f8f9fa; border-radius: 8px; padding: 10px 4px; }
        .h2h-num { font-size: 20px; font-weight: bold; color: #667eea; }
        .h2h-lbl { font-size: 11px; color: #888; margin-top: 2px; }
        .h2h-list { font-size: 12px; }
        .h2h-item { display: flex; justify-content: space-between;
            padding: 5px 0; border-bottom: 1px solid #f0f0f0; gap: 6px; flex-wrap: wrap; }
        .h2h-item:last-child { border-bottom: none; }
        .h2h-score { font-weight: 700; }
        .h2h-comp { color: #aaa; font-size: 11px; }

        /* alineaciones */
        .lineup-list { list-style: none; font-size: 13px; }
        .lineup-list li { padding: 4px 0; border-bottom: 1px solid #f5f5f5;
            display: flex; gap: 7px; align-items: center; }
        .lineup-list li:last-child { border-bottom: none; }
        .lineup-num { color: #aaa; min-width: 22px; font-size: 12px; }
        .lineup-pos { background: #f0f0f0; border-radius: 4px;
            padding: 1px 5px; font-size: 11px; color: #555; }
        .lineup-cap { color: #f59e0b; font-size: 11px; }

        /* recomendaciones */
        .rec-card { border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; border-left: 5px solid; }
        .rec-alta  { background: #e8f5e9; border-color: #4caf50; }
        .rec-media { background: #e3f2fd; border-color: #2196f3; }
        .rec-baja  { background: #fafafa; border-color: #bdbdbd; }
        .rec-tipo  { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
        .rec-razon { font-size: 13px; color: #555; margin-bottom: 5px; }
        .rec-meta  { display: flex; gap: 14px; font-size: 12px; color: #777; }
        .rec-conf  { font-weight: 600; }
        .conf-alta  { color: #2e7d32; }
        .conf-media { color: #1565c0; }
        .conf-baja  { color: #757575; }

        .error-box { background: #fff0f0; color: #c33;
            padding: 16px; border-radius: 8px; border-left: 4px solid #c33; }
        .info-box { background: #e3f2fd; color: #1565c0;
            padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Analizador de Partidos</h1>
        <p>Scalping deportivo · Sofascore en tiempo real</p>
    </div>

    <div class="card">
        <form id="frm">
            <div class="form-group">
                <label>Equipo Local</label>
                <input type="text" id="eqA" placeholder="Ej: AC Milan" required>
            </div>
            <div class="form-group">
                <label>Equipo Visitante</label>
                <input type="text" id="eqB" placeholder="Ej: Como" required>
            </div>
            <div class="form-group">
                <label>Liga (opcional)</label>
                <select id="liga">
                    <option value="">Auto-detectar</option>
                    <option value="Premier League">Premier League</option>
                    <option value="La Liga">La Liga</option>
                    <option value="Serie A">Serie A</option>
                    <option value="Bundesliga">Bundesliga</option>
                    <option value="Ligue 1">Ligue 1</option>
                    <option value="Champions League">Champions League</option>
                    <option value="Primeira Liga">Primeira Liga (Portugal)</option>
                    <option value="Copa Libertadores">Copa Libertadores</option>
                    <option value="Copa Sudamericana">Copa Sudamericana</option>
                    <option value="Super Lig">Süper Lig (Turquía)</option>
                    <option value="Liga Profesional Argentina">Liga Profesional Argentina</option>
                </select>
            </div>
            <button type="submit" id="btn">Analizar Partido</button>
        </form>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Buscando partido...</p>
        <p id="loadingMsg"></p>
    </div>

    <div class="resultado" id="resultado"></div>
</div>

<script>
const API = 'https://api.sofascore.com/api/v1';

// Sofascore no tiene CORS para llamadas directas del browser en producción,
// así que usamos un proxy CORS público solo para leer datos.
// allorigins.win reenvía la respuesta con headers CORS correctos.
async function sfGet(path) {
    const url = `${API}${path}`;
    try {
        // Intentar directo primero (funciona en algunos navegadores/redes)
        const r = await fetch(url, {
            headers: {
                'Accept': 'application/json',
            }
        });
        if (r.ok) return await r.json();
    } catch (_) {}

    // Fallback: proxy CORS
    try {
        const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        const r2 = await fetch(proxy);
        if (r2.ok) {
            const wrapper = await r2.json();
            return JSON.parse(wrapper.contents);
        }
    } catch (_) {}

    return null;
}

function setMsg(txt) { document.getElementById('loadingMsg').textContent = txt; }

document.getElementById('frm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const eqA  = document.getElementById('eqA').value.trim();
    const eqB  = document.getElementById('eqB').value.trim();
    const liga = document.getElementById('liga').value;
    const btn  = document.getElementById('btn');

    document.getElementById('loading').style.display  = 'block';
    document.getElementById('resultado').style.display = 'none';
    btn.disabled = true;

    try {
        // 1. El servidor busca el partido y devuelve IDs (Render)
        setMsg('Buscando partido en Sofascore...');
        const resp = await fetch('/buscar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({equipo_a: eqA, equipo_b: eqB, liga})
        });
        const base = await resp.json();
        if (base.error) { renderError(base.error); return; }

        // 2. El browser hace las calls pesadas a Sofascore directamente
        setMsg('Obteniendo forma reciente...');
        const [lastA, lastB] = await Promise.all([
            sfGet(`/team/${base.team_a_id}/events/last/0`),
            sfGet(`/team/${base.team_b_id}/events/last/0`),
        ]);

        setMsg('Obteniendo alineaciones y árbitro...');
        const [lineups, eventData, h2hData] = await Promise.all([
            sfGet(`/event/${base.event_id}/lineups`),
            sfGet(`/event/${base.event_id}`),
            sfGet(`/event/${base.event_id}/h2h`),
        ]);

        setMsg('Calculando estadísticas...');
        // Corners/tarjetas: stats de últimos 5 partidos de cada equipo
        const eventsA = (lastA?.events || []).filter(e => e?.status?.code === 100).slice(-5);
        const eventsB = (lastB?.events || []).filter(e => e?.status?.code === 100).slice(-5);

        const statsA = await fetchEventStats(eventsA, base.team_a_id);
        const statsB = await fetchEventStats(eventsB, base.team_b_id);

        // Árbitro
        const arbitro = eventData?.event?.referee?.name || '';
        const estadio = eventData?.event?.venue?.stadium?.name || '';

        const resultado = buildResultado(base, lastA, lastB, lineups, h2hData, statsA, statsB, arbitro, estadio);
        renderResultado(resultado);

    } catch (err) {
        renderError('Error inesperado: ' + err.message);
    } finally {
        document.getElementById('loading').style.display = 'none';
        btn.disabled = false;
    }
});

// ── Helpers de datos ──────────────────────────────────────────────────────────

async function fetchEventStats(events, teamId) {
    const cornersArr = [], amarillasArr = [];
    for (const ev of events.slice(-5)) {
        const data = await sfGet(`/event/${ev.id}/statistics`);
        if (!data?.statistics) continue;
        const esLocal = ev?.homeTeam?.id === teamId;
        const lado = esLocal ? 'home' : 'away';
        for (const grupo of data.statistics) {
            for (const grp of (grupo.groups || [])) {
                for (const st of (grp.statisticsItems || [])) {
                    const nom = (st.name || '').toLowerCase();
                    const val = parseFloat((st[lado] || '0').toString().replace(',', '.')) || 0;
                    if (nom.includes('corner')) cornersArr.push(val);
                    if (nom.includes('yellow')) amarillasArr.push(val);
                }
            }
        }
        await sleep(400);
    }
    return {
        corners: cornersArr.length ? +(cornersArr.reduce((a,b)=>a+b,0)/cornersArr.length).toFixed(1) : null,
        amarillas: amarillasArr.length ? +(amarillasArr.reduce((a,b)=>a+b,0)/amarillasArr.length).toFixed(1) : null,
    };
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function buildResultado(base, lastA, lastB, lineups, h2hData, statsA, statsB, arbitro, estadio) {
    const formaA = parseFoma(lastA?.events || [], base.team_a_id);
    const formaB = parseFoma(lastB?.events || [], base.team_b_id);

    return {
        metadata: {
            equipo_a: base.equipo_a,
            equipo_b: base.equipo_b,
            competicion: base.competicion,
            fecha: base.fecha,
            estadio,
            arbitro,
        },
        alineaciones: parseLineups(lineups),
        forma: {
            forma_a: formaA.forma,
            detalle_a: formaA.detalle,
            forma_b: formaB.forma,
            detalle_b: formaB.detalle,
        },
        estadisticas: {
            equipo_a: calcStats(lastA?.events || [], base.team_a_id),
            equipo_b: calcStats(lastB?.events || [], base.team_b_id),
        },
        corners: {
            promedio_total_a: statsA.corners,
            promedio_total_b: statsB.corners,
        },
        tarjetas: {
            promedio_amarillas_a: statsA.amarillas,
            promedio_amarillas_b: statsB.amarillas,
        },
        h2h: parseH2H(h2hData, base.equipo_a, base.equipo_b),
        recomendaciones: [],  // se calculan en renderResultado
    };
}

function parseFoma(events, teamId) {
    const terminados = events.filter(e => e?.status?.code === 100).slice(-5);
    const forma = [], detalle = [];
    for (const ev of terminados) {
        const esLocal = ev?.homeTeam?.id === teamId;
        const gf = (esLocal ? ev?.homeScore?.current : ev?.awayScore?.current) || 0;
        const gc = (esLocal ? ev?.awayScore?.current : ev?.homeScore?.current) || 0;
        forma.push(gf > gc ? 'V' : gf === gc ? 'E' : 'D');
        const ts = ev?.startTimestamp;
        const fecha = ts ? new Date(ts * 1000).toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit'}) : '';
        const rival = esLocal ? ev?.awayTeam?.name : ev?.homeTeam?.name;
        detalle.push({ rival, resultado: `${gf}-${gc}`, fecha, local: esLocal });
    }
    return { forma, detalle };
}

function calcStats(events, teamId) {
    const terminados = events.filter(e => e?.status?.code === 100).slice(-5);
    if (!terminados.length) return {};
    const gf = [], gc = [];
    for (const ev of terminados) {
        const esLocal = ev?.homeTeam?.id === teamId;
        gf.push((esLocal ? ev?.homeScore?.current : ev?.awayScore?.current) || 0);
        gc.push((esLocal ? ev?.awayScore?.current : ev?.homeScore?.current) || 0);
    }
    const n = gf.length;
    const sumGf = gf.reduce((a,b)=>a+b,0);
    const sumGc = gc.reduce((a,b)=>a+b,0);
    return {
        goles_marcados: sumGf,
        goles_recibidos: sumGc,
        promedio_gf: +(sumGf/n).toFixed(2),
        promedio_gc: +(sumGc/n).toFixed(2),
        clean_sheets: gc.filter(g=>g===0).length,
        partidos_analizados: n,
    };
}

function parseLineups(data) {
    if (!data) return { confirmadas: false, formacion_a:'', formacion_b:'', titulares_a:[], titulares_b:[] };
    const parse = (lado) => {
        const eq = data[lado] || {};
        return {
            formacion: eq.formation || '',
            titulares: (eq.players || [])
                .filter(p => !p.substitute)
                .map(p => ({
                    nombre: p?.player?.name || '',
                    posicion: p?.position || '',
                    numero: p?.shirtNumber || '',
                    capitan: !!p?.captain,
                })),
        };
    };
    const h = parse('home'), a = parse('away');
    return {
        confirmadas: !!data.confirmed,
        formacion_a: h.formacion,
        formacion_b: a.formacion,
        titulares_a: h.titulares,
        titulares_b: a.titulares,
    };
}

function parseH2H(data, nombreA, nombreB) {
    if (!data?.events) return { historial: [], resumen: {} };
    let vA = 0, vB = 0, emp = 0;
    const historial = data.events.slice(0, 10).map(ev => {
        const home = ev?.homeTeam?.name || '';
        const away = ev?.awayTeam?.name || '';
        const sh = ev?.homeScore?.current || 0;
        const sa = ev?.awayScore?.current || 0;
        const ts = ev?.startTimestamp;
        const fecha = ts ? new Date(ts*1000).toLocaleDateString('es-ES') : '';
        if (sh > sa) { nombreA.toLowerCase().includes(home.toLowerCase().slice(0,4)) ? vA++ : vB++; }
        else if (sh < sa) { nombreA.toLowerCase().includes(away.toLowerCase().slice(0,4)) ? vA++ : vB++; }
        else emp++;
        return { local: home, visitante: away, resultado: `${sh}-${sa}`,
                 fecha, competicion: ev?.tournament?.name || '' };
    });
    return { historial, resumen: { victorias_a: vA, victorias_b: vB, empates: emp, total: historial.length } };
}

function generarRecomendaciones(r) {
    const recs = [];
    const stA = r.estadisticas.equipo_a;
    const stB = r.estadisticas.equipo_b;
    const fA  = r.forma.forma_a;
    const cA  = r.corners.promedio_total_a;
    const cB  = r.corners.promedio_total_b;
    const h   = r.h2h.resumen;

    if (stA.promedio_gc > 0.8 && stB.promedio_gf > 0.8)
        recs.push({ tipo:'Ambos Equipos Marcan (SI)',
            razon:`Local recibe ${stA.promedio_gc?.toFixed(1)} goles/partido, visitante marca ${stB.promedio_gf?.toFixed(1)}`,
            confianza:'Media', cuota_tipica:'1.75-1.90' });

    if (cA && cB && (cA+cB) > 9)
        recs.push({ tipo:'Más de 9.5 corners',
            razon:`Promedio combinado: ${(cA+cB).toFixed(1)} corners/partido`,
            confianza: (cA+cB) > 10.5 ? 'Media-Alta' : 'Media', cuota_tipica:'1.75-1.85' });

    const vic = fA.filter(x=>x==='V').length;
    if (vic >= 3)
        recs.push({ tipo:'Victoria Local',
            razon:`${r.metadata.equipo_a} ganó ${vic} de sus últimos ${fA.length} partidos`,
            confianza: vic >= 4 ? 'Media-Alta' : 'Media', cuota_tipica:'1.70-1.90' });

    if (stA.promedio_gf && stB.promedio_gf && (stA.promedio_gf + stB.promedio_gf) > 2.8)
        recs.push({ tipo:'Más de 2.5 goles',
            razon:`Promedios ofensivos: ${stA.promedio_gf?.toFixed(1)} + ${stB.promedio_gf?.toFixed(1)} goles/partido`,
            confianza:'Media', cuota_tipica:'1.75-1.85' });

    if (h.total >= 5 && h.victorias_a / h.total >= 0.6)
        recs.push({ tipo:'Ventaja histórica Local',
            razon:`${r.metadata.equipo_a} ganó ${h.victorias_a}/${h.total} enfrentamientos directos`,
            confianza:'Media', cuota_tipica:'1.75-1.90' });

    if (!recs.length)
        recs.push({ tipo:'Sin recomendación clara', razon:'Datos insuficientes o partido equilibrado',
            confianza:'Baja', cuota_tipica:'N/A' });
    return recs;
}

// ── Render ────────────────────────────────────────────────────────────────────

function v(x) { return (x !== null && x !== undefined && x !== '') ? x : '—'; }

function formaBadges(arr) {
    if (!arr?.length) return '<span style="color:#aaa">Sin datos</span>';
    return arr.map(r=>`<span class="badge badge-${r}">${r}</span>`).join('');
}
function formaDetalle(arr) {
    if (!arr?.length) return '';
    return arr.map(d=>`<div class="forma-item">${d.fecha} ${d.local?'vs':'en'} ${d.rival||'?'} — <strong>${d.resultado}</strong></div>`).join('');
}
function confClass(c) {
    if (!c) return 'conf-baja';
    return c.toLowerCase().includes('alta') ? 'conf-alta' : c.toLowerCase().includes('media') ? 'conf-media' : 'conf-baja';
}
function recClass(c) {
    if (!c) return 'rec-baja';
    return c.toLowerCase().includes('alta') ? 'rec-alta' : c.toLowerCase().includes('media') ? 'rec-media' : 'rec-baja';
}
function sr(lbl, val) {
    return `<div class="stat-row"><span class="stat-lbl">${lbl}</span><span class="stat-val">${v(val)}</span></div>`;
}

function renderResultado(data) {
    data.recomendaciones = generarRecomendaciones(data);
    const el = document.getElementById('resultado');
    const m  = data.metadata;
    const al = data.alineaciones;
    const fo = data.forma;
    const st = data.estadisticas;
    const cor= data.corners;
    const tar= data.tarjetas;
    const h  = data.h2h;

    const fecha = m.fecha ? new Date(m.fecha).toLocaleString('es-ES',{dateStyle:'full',timeStyle:'short'}) : '—';

    let html = `
    <div class="card match-header">
        <div class="vs-row">
            <div class="team-name">${m.equipo_a}</div>
            <div class="vs-badge">VS</div>
            <div class="team-name">${m.equipo_b}</div>
        </div>
        <div class="match-meta">
            ${fecha}<br>
            ${m.competicion ? m.competicion+'<br>' : ''}
            ${m.estadio ? 'Estadio: '+m.estadio+'<br>' : ''}
            ${m.arbitro ? 'Árbitro: '+m.arbitro : ''}
        </div>
        <span class="source-badge">Sofascore (tiempo real)</span>
    </div>`;

    // Alineaciones
    if (al.titulares_a.length || al.titulares_b.length) {
        html += `<div class="card"><h2>Alineaciones ${al.confirmadas?'(Confirmadas)':'(Previstas)'}</h2><div class="two-col">`;
        for (const [eq,tit,form] of [[m.equipo_a,al.titulares_a,al.formacion_a],[m.equipo_b,al.titulares_b,al.formacion_b]]) {
            html += `<div><div class="col-header">${eq} ${form?'('+form+')':''}</div><ul class="lineup-list">
            ${tit.map(j=>`<li><span class="lineup-num">${j.numero||''}</span><span>${j.nombre}</span><span class="lineup-pos">${j.posicion||''}</span>${j.capitan?'<span class="lineup-cap">(C)</span>':''}</li>`).join('')}
            </ul></div>`;
        }
        html += `</div></div>`;
    }

    // Forma
    html += `<div class="card"><h2>Forma Reciente (últimos 5)</h2><div class="two-col">
    <div><div class="col-header">${m.equipo_a}</div><div class="forma-badges">${formaBadges(fo.forma_a)}</div><div class="forma-detalle">${formaDetalle(fo.detalle_a)}</div></div>
    <div><div class="col-header">${m.equipo_b}</div><div class="forma-badges">${formaBadges(fo.forma_b)}</div><div class="forma-detalle">${formaDetalle(fo.detalle_b)}</div></div>
    </div></div>`;

    // Estadísticas
    const sA = st.equipo_a, sB = st.equipo_b;
    if (Object.keys(sA).length || Object.keys(sB).length) {
        html += `<div class="card"><h2>Estadísticas (últimos 5 partidos)</h2><div class="two-col">
        <div><div class="col-header">${m.equipo_a}</div>
        ${sr('Goles marcados',sA.goles_marcados)}${sr('Goles recibidos',sA.goles_recibidos)}
        ${sr('Promedio GF',sA.promedio_gf)}${sr('Promedio GC',sA.promedio_gc)}
        ${sr('Clean sheets',sA.clean_sheets)}</div>
        <div><div class="col-header">${m.equipo_b}</div>
        ${sr('Goles marcados',sB.goles_marcados)}${sr('Goles recibidos',sB.goles_recibidos)}
        ${sr('Promedio GF',sB.promedio_gf)}${sr('Promedio GC',sB.promedio_gc)}
        ${sr('Clean sheets',sB.clean_sheets)}</div>
        </div></div>`;
    }

    // Corners y tarjetas
    if (cor.promedio_total_a || cor.promedio_total_b) {
        const total = cor.promedio_total_a && cor.promedio_total_b
            ? (cor.promedio_total_a + cor.promedio_total_b).toFixed(1) : null;
        html += `<div class="card"><h2>Corners y Tarjetas</h2><div class="two-col">
        <div><div class="col-header">Corners (promedio/partido)</div>
        ${sr(m.equipo_a, cor.promedio_total_a)}${sr(m.equipo_b, cor.promedio_total_b)}
        ${total ? sr('Total combinado', total) : ''}</div>
        <div><div class="col-header">Amarillas (promedio/partido)</div>
        ${sr(m.equipo_a, tar.promedio_amarillas_a)}${sr(m.equipo_b, tar.promedio_amarillas_b)}</div>
        </div></div>`;
    }

    // H2H
    if (h.historial?.length) {
        const r = h.resumen;
        html += `<div class="card"><h2>Historial Directo (H2H)</h2>
        <div class="h2h-summary">
            <div class="h2h-box"><div class="h2h-num">${r.victorias_a||0}</div><div class="h2h-lbl">${m.equipo_a}</div></div>
            <div class="h2h-box"><div class="h2h-num">${r.empates||0}</div><div class="h2h-lbl">Empates</div></div>
            <div class="h2h-box"><div class="h2h-num">${r.victorias_b||0}</div><div class="h2h-lbl">${m.equipo_b}</div></div>
        </div>
        <div class="h2h-list">${h.historial.slice(0,8).map(p=>`
        <div class="h2h-item">
            <span>${p.fecha}</span>
            <span>${p.local} <strong class="h2h-score">${p.resultado}</strong> ${p.visitante}</span>
            <span class="h2h-comp">${p.competicion}</span>
        </div>`).join('')}</div></div>`;
    }

    // Recomendaciones
    const recs = data.recomendaciones;
    if (recs.length) {
        html += `<div class="card"><h2>Recomendaciones de Apuesta</h2>
        <p style="font-size:12px;color:#aaa;margin-bottom:12px">Solo orientativo. Las apuestas conllevan riesgo de pérdida económica.</p>`;
        recs.forEach(r => {
            html += `<div class="rec-card ${recClass(r.confianza)}">
            <div class="rec-tipo">${r.tipo}</div>
            <div class="rec-razon">${r.razon}</div>
            <div class="rec-meta">
                <span>Confianza: <strong class="rec-conf ${confClass(r.confianza)}">${r.confianza}</strong></span>
                <span>Cuota: <strong>${r.cuota_tipica}</strong></span>
            </div></div>`;
        });
        html += `</div>`;
    }

    el.innerHTML = html;
    el.style.display = 'block';
}

function renderError(msg) {
    const el = document.getElementById('resultado');
    el.innerHTML = `<div class="card error-box">Error: ${msg}</div>`;
    el.style.display = 'block';
}
</script>
</body>
</html>
